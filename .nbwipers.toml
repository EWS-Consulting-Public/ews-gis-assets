# Notebook cleaning config for nbwipers (git filter + make format)
# https://github.com/felixgwilliams/nbwipers

id-action = "drop"
# Strip kernelspec and language_info.version. They are per-machine facts -
# kernelspec.display_name is the local venv name and language_info.version the
# exact patch release - so recreating a venv or switching Windows<->Linux
# produced spurious diffs in every notebook. Measured 2026-08-07 [FF-0708].
# The old reason for keeping them (smudge fails in git-submodule worktrees)
# no longer applies: ablmesh is the last repo with submodules and it has no
# nbwipers config. Cost: an editor will prompt for a kernel on a fresh clone.
strip-kernel-info = true
drop-empty-cells = true

extra-keys = [
    "cell.metadata.code_folding",
    "cell.metadata.execution",
    "cell.metadata.heading_collapsed",
    "cell.metadata.hidden",
    "cell.metadata.init_cell",
    "cell.metadata.tags",
    "metadata.celltoolbar",
    "metadata.jupytext",
    "metadata.notify_time",
    "metadata.varInspector",
    "metadata.nbTranslate",
]

keep-keys = [
    "cell.metadata.toc",
    "metadata.toc",
    "metadata.ewsTemplate",
    "metadata.hide_input",
    "metadata.keep_output",
    "metadata.nbformat",
    "metadata.nbformat_minor",
]

extend-exclude = [
    "**/.venv/**",
    "**/docs/**",
    "**/.ipynb_checkpoints/**",
    "**/.virtual_documents/**",
]
