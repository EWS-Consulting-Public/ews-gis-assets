ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

repos:
# Standard hooks

# Notebook output control: the git filter strips on commit; these hooks verify
# the filter is registered. Replaces the commented-out nbstripout-fast block,
# which was parked because prek did not implement it - nbwipers does run under
# prek, and is the estate standard (9 repos, 2026-08-07).
# Fresh clone needs one step: `nbwipers install local`.
- repo: https://github.com/felixgwilliams/nbwipers-pre-commit
  rev: v0.6.2
  hooks:
    - id: nbwipers-check-install
    - id: nbwipers-large-files
      # No --enforce-all here, unlike ews-windpro: this repo stores GIS data on
      # purpose, and --enforce-all walks the whole tree, flagging
      # data/ooe_wind_exclusion.geojson (22 MB) and seven more assets that are
      # the repo's reason to exist. Staged-only is the right gate here.

- repo: https://github.com/mwouts/jupytext
  rev: v1.18.1  # pin to a tested version
  hooks:
    - id: jupytext
      args: [--sync]    # ensures the paired file is updated on commit
      files: \.(ipynb|py)$


- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: ['--maxkb=2048', '--enforce-all']
    # data/ holds published GeoJSON/GPKG (CI-owned, routinely multi-MB).
    # Lock files can be large in APPLICATION projects (reproducibility).
    exclude: '^(data/|uv\.lock$|poetry\.lock$|package-lock\.json$|yarn\.lock$|.*\.ipynb$)'
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-yaml
    exclude: ^conda\.recipe/meta\.yaml$
  - id: debug-statements
  - id: end-of-file-fixer
    exclude: ^data/
  - id: mixed-line-ending
  - id: requirements-txt-fixer
  - id: trailing-whitespace
    exclude: ^data/

# Check linting and style issues
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: "v0.14.3"
  hooks:
    - id: ruff
      args: ["--fix", "--show-fixes"]
    - id: ruff-format
      exclude: ^(docs)

# .claude/ is generated from .cursor/ - fail if it drifts. Hand-mirroring
# these trees demonstrably rots; see rule agent-config-sync.
- repo: local
  hooks:
    - id: sync-agent-config
      name: agent config (.claude generated from .cursor)
      entry: uv run python scripts/sync_agent_config.py --check
      language: system
      files: ^\.(cursor|claude)/|^scripts/sync_agent_config\.py$
      pass_filenames: false
