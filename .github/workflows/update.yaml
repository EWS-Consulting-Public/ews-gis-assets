name: Update GeoJSON Daily
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-geojson:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run the update script
        run: |
          uv run download_noe_wind_turbines.py
          uv run download_austro_control.py
          uv run download_noe_wind_zones.py
          uv run download_noe_pv_zones.py
          uv run download_styria_sapro_wind.py
          uv run download_ooe_wind_exclusion.py

      - name: Check for changes
        id: check_changes
        run: |
          if [ "$(git status --porcelain data/)" != "" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: update GIS asset files (automated)"
          git push

      - name: Create GitHub Release
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="data-$(date -u +%Y.%m.%d-%H%M%S)"
          # Always attach the full consumer asset set so /releases/latest/download/<name> stays valid.
          ASSETS=(
            data/windkraftanlagen.geojson
            data/windkraftanlagen.gpkg
            data/austro_control_icao.geojson
            data/austro_control_icao.gpkg
            data/noe_wind_zones.geojson
            data/noe_wind_zones.gpkg
            data/noe_pv_zones.geojson
            data/noe_pv_zones.gpkg
            data/styria_sapro_wind.geojson
            data/styria_sapro_wind.gpkg
            data/ooe_wind_exclusion.geojson
            data/ooe_wind_exclusion.gpkg
          )
          CHANGED="$(git diff --name-only HEAD~1 HEAD -- data/ || true)"
          NOTES="$(printf 'Automated GIS asset release.\n\nChanged paths:\n```\n%s\n```\n\nStable URLs:\n- https://github.com/%s/releases/latest/download/windkraftanlagen.geojson\n- https://github.com/%s/releases/latest/download/austro_control_icao.geojson\n- https://github.com/%s/releases/latest/download/noe_wind_zones.geojson\n' "$CHANGED" "${{ github.repository }}" "${{ github.repository }}" "${{ github.repository }}")"
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "GIS assets ${TAG}" \
            --notes "$NOTES" \
            --latest
          echo "Created https://github.com/${{ github.repository }}/releases/tag/${TAG}"
