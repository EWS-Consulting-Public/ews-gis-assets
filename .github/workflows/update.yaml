name: Update GeoJSON Daily
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-geojson:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # Run every downloader even if one source is down. Successful updates still
      # commit/release; a trailing step fails the job so the outage is visible.
      - name: Run downloaders
        id: downloads
        run: |
          set +e
          failed=0
          scripts=(
            download_noe_wind_turbines.py
            download_austro_control.py
            download_noe_wind_zones.py
            download_noe_pv_zones.py
            download_styria_sapro_wind.py
            download_styria_sapro_bereich.py
            download_ooe_wind_exclusion.py
            download_ktn_red_iii_wind.py
          )
          for script in "${scripts[@]}"; do
            echo "::group::${script}"
            uv run "${script}"
            rc=$?
            echo "::endgroup::"
            if [ "${rc}" -ne 0 ]; then
              echo "::error::${script} failed with exit code ${rc}"
              failed=1
            fi
          done
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"

      - name: Check for changes
        id: check_changes
        run: |
          if [ "$(git status --porcelain data/)" != "" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: update GIS asset files (automated)"
          git push

      - name: Create GitHub Release
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="data-$(date -u +%Y.%m.%d-%H%M%S)"
          # Attach whatever consumer assets exist so a single failed downloader
          # cannot break the release of the others.
          CANDIDATES=(
            data/windkraftanlagen.geojson
            data/windkraftanlagen.gpkg
            data/austro_control_icao.geojson
            data/austro_control_icao.gpkg
            data/noe_wind_zones.geojson
            data/noe_wind_zones.gpkg
            data/noe_pv_zones.geojson
            data/noe_pv_zones.gpkg
            data/styria_sapro_wind.geojson
            data/styria_sapro_wind.gpkg
            data/styria_sapro_bereich.geojson
            data/styria_sapro_bereich.gpkg
            data/ooe_wind_exclusion.geojson
            data/ooe_wind_exclusion.gpkg
            data/ktn_red_iii_wind.geojson
            data/ktn_red_iii_wind.gpkg
          )
          ASSETS=()
          for f in "${CANDIDATES[@]}"; do
            if [ -f "${f}" ]; then
              ASSETS+=("${f}")
            else
              echo "::warning::missing asset ${f} — skipped for this release"
            fi
          done
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::no release assets found under data/"
            exit 1
          fi
          CHANGED="$(git diff --name-only HEAD~1 HEAD -- data/ || true)"
          NOTES="$(printf 'Automated GIS asset release.\n\nChanged paths:\n```\n%s\n```\n\nStable URLs:\n- https://github.com/%s/releases/latest/download/windkraftanlagen.geojson\n- https://github.com/%s/releases/latest/download/austro_control_icao.geojson\n- https://github.com/%s/releases/latest/download/noe_wind_zones.geojson\n' "$CHANGED" "${{ github.repository }}" "${{ github.repository }}" "${{ github.repository }}")"
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "GIS assets ${TAG}" \
            --notes "$NOTES" \
            --latest
          echo "Created https://github.com/${{ github.repository }}/releases/tag/${TAG}"

      - name: Fail job if any downloader failed
        if: steps.downloads.outputs.failed == '1'
        run: |
          echo "One or more downloaders failed — see grouped logs above."
          exit 1
